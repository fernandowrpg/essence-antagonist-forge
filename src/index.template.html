*{box-sizing:border-box}
.bk{font:600 11px/1 var(--mono);padding:2px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.bk.poc{color:var(--c-antagonist);border-color:var(--c-antagonist)}
.blk summary{cursor:pointer}.blk td:first-child{min-width:260px}.blk .small{max-width:420px}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.35rem;letter-spacing:.02em;margin-right:auto;white-space:nowrap}
.brand small{font-family:var(--body);font-size:.8rem;color:var(--muted);margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);background:var(--sunk);border-color:var(--line)}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:none;padding:5px 10px;cursor:pointer;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
main{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:70ch;margin:0 0 16px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.ess{display:flex;gap:6px}
.ess button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--display);font-size:1.2rem}
.ess button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.strip{display:flex;gap:6px 22px;flex-wrap:wrap;padding:10px 14px;background:var(--sunk);border-radius:8px;margin:12px 0}
.strip div{display:flex;flex-direction:column}
.strip b{font-family:var(--mono);font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{white-space:nowrap}
.tier{font-family:var(--display);font-size:1.02rem;white-space:nowrap}
.small{font-size:.85rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--fg);min-width:0}
.filters input[type=search]{width:min(260px,100%)}
.count{color:var(--muted);font-size:.9rem;margin-left:auto}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.item{padding:12px 4px 12px 14px;border-bottom:1px solid var(--line);border-left:3px solid var(--src,var(--line));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.item h3{font-size:1.08rem}
.meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.chip{display:inline-block;font-family:var(--body);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--src);border:1px solid currentColor;border-radius:999px;padding:0 8px;line-height:1.6}
.sum{grid-column:1/-1;margin:2px 0 0;max-width:80ch}
details{grid-column:1/-1}
summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.modes{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.modes li{font-size:.92rem;padding-left:10px;border-left:2px solid var(--line)}
.modes li.hl{border-left-color:var(--accent);background:var(--sunk)}
.modes b{font-weight:500}
.sheet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 100px);overflow:auto}
.sheet h3{margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.stats label{display:flex;flex-direction:column;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stats input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-family:var(--mono);font-size:.95rem}
.field{display:flex;flex-direction:column;gap:2px;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:8px}
.field input,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--fg)}
.picked{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:4px}
.picked li{display:flex;gap:8px;align-items:baseline;font-size:.9rem;border-bottom:1px dashed var(--line);padding:3px 0}
.picked li span{flex:1;min-width:0}
.x{border:0;background:none;color:var(--warn);cursor:pointer;font-size:1rem;padding:0 4px}
textarea.io{width:100%;min-height:130px;font-family:var(--mono);font-size:.75rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:.9rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.qgroup h3{margin:18px 0 6px;color:var(--muted);font-size:1rem}
.note{font-size:.88rem;color:var(--muted);max-width:80ch}
.note li{margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- enemy dock ---- */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
.head .bar{position:static}
.dock{background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 24px rgb(0 0 0 / .12);display:flex;flex-direction:column;min-height:0;z-index:7}
.dock-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk)}
.dock-h select{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.pos{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.pos button,.ib{border:0;background:var(--surface);width:30px;height:28px;cursor:pointer;color:var(--muted);font-size:.9rem}
.pos button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ib{border:1px solid var(--line);border-radius:5px}
.dock-b{padding:10px 12px;overflow:auto;min-height:0}
.dock-b h3{font-size:1.2rem}
.statline{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;margin:8px 0}
.statline div{background:var(--sunk);border-radius:5px;padding:3px 6px;display:flex;flex-direction:column}
.statline span{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.statline .wide{grid-column:span 2}
.statline b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.dock-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dock-actions .btn{font-size:.85rem;padding:4px 8px}
.dock[data-min="1"] .dock-b{display:none}
/* side docks */
body[data-dock="right"] .dock,body[data-dock="left"] .dock{position:fixed;top:calc(var(--headh,64px) + 12px);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:330px;border-radius:10px}
body[data-dock="right"] .dock{right:12px} body[data-dock="left"] .dock{left:12px}
body[data-dock="right"] main{padding-right:calc(346px + 16px)} body[data-dock="left"] main{padding-left:calc(346px + 16px)}
body[data-dock="right"] .dock[data-min="1"],body[data-dock="left"] .dock[data-min="1"]{bottom:auto}
/* top / bottom docks */
body[data-dock="top"] .dock{margin:8px auto 0;max-width:min(980px,calc(100% - 32px));border-radius:10px;max-height:36vh}
body[data-dock="bottom"] .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(980px,calc(100% - 32px));border-radius:10px;max-height:38vh}
body[data-dock="bottom"] main{padding-bottom:calc(40vh + 20px)}
body[data-dock="top"] .dock-b,body[data-dock="bottom"] .dock-b{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4px 18px}
body[data-dock="top"] .dock[data-min="1"] .dock-b,body[data-dock="bottom"] .dock[data-min="1"] .dock-b{display:none}
@media (max-width:900px){
  body[data-dock="right"] .dock,body[data-dock="left"] .dock{top:auto;left:50%;right:auto;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-height:42vh}
  body[data-dock="right"] main,body[data-dock="left"] main{padding-right:16px;padding-left:16px;padding-bottom:calc(44vh + 20px)}
  body[data-dock] .dock-b{display:block!important}
  body[data-dock] .dock[data-min="1"] .dock-b{display:none!important}
  .pos-side{display:none}
}
.roster{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.roster li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.roster li[aria-current="true"] b{color:var(--accent)}
.roster li span{flex:1;min-width:0}
.roster li>span.chip{flex:0 0 auto}
.folder{border-bottom:1px solid var(--line)}
.folder>summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;cursor:pointer;font-weight:600}
.folder>summary .small{font-weight:400}
.folder>summary .grow{flex:1;min-width:0}
.folder .roster{margin:0 0 6px;padding-left:14px;border-left:2px solid var(--line)}
.folder .roster li:last-child{border-bottom:0}
.imp{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:8px}
.imp label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);flex:1;min-width:160px}
.imp input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:.95rem}
.bgbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}
.bgbox .chk{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.bgbox .stats{margin-top:4px}
.bgbox select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:.95rem;text-transform:none;letter-spacing:0}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.field select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:.95rem;text-transform:none;letter-spacing:0}
.steps{font-size:.88rem;color:var(--muted);padding-left:18px;margin:6px 0}
</style>

const MOTES_HI={6:17,7:20,8:20,9:22,10:27};

  health:5,defense:3,soak:2,hardness:3,resolve:3,weapon:'',folder:'',battlegroup:false,size:1,drill:1,qualities:[],charms:[],notes:''});
/* ---------- battle groups (p. 322-323) ---------- */
const BGSIZE=s=>T.battleGroups.sizes[Math.max(0,Math.min(5,+s||0))];
const BGDRILL=d=>T.battleGroups.drill[Math.max(0,Math.min(3,+d||0))];
/* More of Us always; Formation Attack from regular, Opportunistic Threat from veteran, Deadly Ground at elite (p. 323); Ranked Assault at Size 2+ (p. 320) */
function bgFree(e){if(!e.battlegroup)return[];const d=+e.drill||0,ids=['quality-more-of-us'];
  if(d>=1)ids.push('quality-formation-attack');if(d>=2)ids.push('quality-opportunistic-threat');if(d>=3)ids.push('quality-deadly-ground');if(+e.size>=2)ids.push('quality-ranked-assault');
  return ids.filter(id=>!e.qualities.some(q=>q.id===id)).map(id=>D.qualities.find(q=>q.id===id)).filter(Boolean)}
const bgLine=e=>`${t('isBg')} · Size ${e.size} (${BGSIZE(e.size).fighters[L]}) · Drill ${BGDRILL(e.drill).drill} (+${BGDRILL(e.drill).bonus})`;
/* older files: battle group quality plus "Size N" / "Drill X" in the notes */
function inferBG(e){if(typeof e.battlegroup==='boolean')return e;const has=(e.qualities||[]).some(q=>q.id==='quality-battle-group');
  e.battlegroup=has;const txt=(e.notes||'')+' '+(e.concept||''),s=txt.match(/Size\s*(\d)/i),d=txt.match(/Drill\s*(Poor|Regular|Veteran|Elite)/i);
  e.size=s?+s[1]:1;e.drill=d?['poor','regular','veteran','elite'].indexOf(d[1].toLowerCase()):1;return e}
let ROSTER=store.get('enemies',null);
if(!Array.isArray(ROSTER)||!ROSTER.length){const old=store.get('enemy',null);ROSTER=[old?Object.assign(blank(),old,{id:uid()}):blank()]}
ROSTER.forEach(e=>{if(!e.id)e.id=uid();if(!e.creature)e.creature='other';if(typeof e.folder!=='string')e.folder='';inferBG(e)});
let OPENF=new Set(store.get('closedFolders',[]));
/* folders in roster order, unfiled last */
const folders=()=>{const s=[...new Set(ROSTER.map(e=>e.folder).filter(Boolean))];return ROSTER.some(e=>!e.folder)?[...s,'']:s};
const inFolder=f=>ROSTER.filter(e=>e.folder===f);

/* ---------- Foundry export (Exalted Essence system 2.0.11) ---------- */
const LIB=new Map([...D.charms,...D.qualities].map(x=>[x.id,x]));
const FX={'dragon-blooded':'dragonblooded','exigent-janest':'exigent',exigent:'exigent',architect:'exigent',sovereign:'exigent','dragon-king':'dragonking','dream-souled':'dreamsouled',umbral:'umbral'};
const FCHARM={'dragon-blooded':'dragonblooded','exigent-janest':'janest','martial-arts':'martialarts',universal:'other',sorcery:'other',exigent:'other',architect:'architect',sovereign:'sovereign','dragon-king':'dragonking','dream-souled':'dreamsouled',umbral:'umbral',antagonist:'other'};
const FCRE={mortal:'mortal',god:'god',demon:'demon',elemental:'elemental',undead:'undead',fae:'fae',behemoth:'behemoth',animal:'animal',construct:'construct',magiccreature:'magiccreature',exalt:'exalt',other:'other'};
function fAbility(s){s=(s||'').toLowerCase();for(const k of['close','ranged','physique','sagacity','athletics','awareness','craft','embassy','integrity','navigate','performance','presence','stealth','war','finesse','force','fortitude'])if(s.startsWith(k))return k;return 'other'}
function fCost(c){c=c||'';const o={motes:0,committed:0,anima:0,health:0,healthtype:'bashing',stunt:0,power:0};let m;
  if(m=c.match(/(commit )?(\d+)m/))o[m[1]?'committed':'motes']=+m[2];if(m=c.match(/(\d+)a\b/))o.anima=+m[1];if(m=c.match(/(\d+) HL/))o.health=+m[1];
  if(m=c.match(/(\d+) Power/))o.power=+m[1];if(m=c.match(/(\d+) stunt/))o.stunt=+m[1];return o}
const gain={motes:0,anima:0,health:0,power:0};
const act={activatable:false,active:false,autoaddtorolls:'',endtrigger:'none'};
function fDesc(x,ref){let h=`<p>${esc(x.summary[L])}</p>`;if(x.mode)h+=`<p><strong>${t('mode')}: ${esc(x.mode.name)}</strong> — ${esc(x.mode.summary[L])}</p>`;
  if(ref&&ref.prerequisites)h+=`<p><em>${esc(ref.prerequisites)}</em></p>`;return h+`<p><em>Exalted: Essence p. ${x.page}</em></p>`}
function toFoundry(e){
  const isEx=EXALTS.includes(e.creature);
  const items=[];
  const w=(e.weapon||'').match(/([+-]?\d+)\s*\/\s*([+-]?\d+)\s*\/\s*(\d+)/);
  const wn=e.weapon.replace(/\s*[+-]?\d+\s*\/.*$/,'').trim(),wl=L==='pt'?'Arma':'Weapon',wname=!wn?wl:/^(natural |heavy |mundane )?artifact$|^(mundane|heavy|medium|light)$/i.test(wn)?`${wl} (${wn})`:wn;
  if(w)items.push({name:wname,type:'weapon',system:{description:'',pagenum:'',accuracy:+w[1],damage:+w[2],defence:0,defense:0,overwhelming:+w[3],equipped:true,weapontype:/ranged|bow|wand|bolt/i.test(e.weapon)?'ranged':'melee',attackeffectpreset:'none',attackeffect:'',weight:/heavy|pesad/i.test(e.weapon)?'heavy':'medium',traits:{weapontags:{value:[],custom:''}}}});
  const quals=[...e.qualities,...bgFree(e).map(pickQ)];
  quals.forEach(q=>items.push({name:q.name,type:'quality',system:{description:fDesc(q),pagenum:'p. '+q.page,...act,cost:fCost((q.summary.en.match(/(commit )?\d+m\b/i)||[''])[0].toLowerCase()),gain:{...gain}}}));
  e.charms.forEach(c=>{const r=LIB.get(c.id)||{};
    if(r.category==='spell'){items.push({name:c.name,type:'spell',system:{description:fDesc(c,r),pagenum:'p. '+c.page,...act,circle:['','first','second','third'][r.circle||1],cost:+((c.cost||'').match(/\d+/)||[0])[0],spelltype:r.school||'universal'}});return}
    const req=+(((r.prerequisites||'').match(/[A-Za-z)]\s(\d)/)||[])[1]||0);
    items.push({name:c.name,type:'charm',system:{description:fDesc(c,r),pagenum:'p. '+c.page,...act,cost:fCost(c.cost),gain:{...gain},
      charmtype:FCHARM[r.source]||FX[r.source]||r.source||'other',ability:r.category==='martial-art'?'martial':fAbility(r.ability),requirement:req,essence:r.minEssence||1,prerequisites:r.prerequisites||'',charmprerequisites:[]}});
  });
  const ess=Math.max(1,+e.essence||1);
  const sys={
    details:{exalt:isEx?(FX[e.creature]||e.creature):'other'},
    creaturetype:isEx?'exalt':(FCRE[e.creature]||'other'),
    essence:{min:0,value:ess,max:10},
    motes:{value:+e.motes>=0?+e.motes:motesFor(ess),min:0,max:15,committed:0},
    power:{min:0,value:0,max:10},
    defense:{min:0,value:+e.defense||0},
    soak:{min:0,value:+e.soak||0},naturalsoak:{min:0,value:+e.soak||0},armoredsoak:{min:0,value:0},
    hardness:{min:0,value:+e.hardness||0},resolve:{min:0,value:+e.resolve||0},
    health:{value:+e.health||1,min:0,max:+e.health||1,levels:+e.health||1,lethal:0,aggravated:0,penalty:0},
    pools:{primary:{value:+e.pools.primary.dice||0,actions:e.pools.primary.actions},secondary:{value:+e.pools.secondary.dice||0,actions:e.pools.secondary.actions},tertiary:{value:+e.pools.tertiary.dice||0,actions:e.pools.tertiary.actions}},
    qualities:quals.map(q=>q.name).join(', '),
    battlegroup:!!e.battlegroup,commandbonus:{min:0,value:0},size:{min:0,value:e.battlegroup?+e.size||0:0},drill:{min:0,value:e.battlegroup?+e.drill||0:0},
    biography:`<p>${esc(e.concept)}</p>${e.battlegroup?`<p><b>${esc(bgLine(e))}</b> · ${esc(t('rout'))}: ${esc(BGDRILL(e.drill).rout[L])}</p>`:''}${e.notes?`<p>${esc(e.notes).replace(/\n/g,'<br>')}</p>`:''}<p><b>Motes:</b> ${+e.motes||0}</p><p><em>Essence Antagonist Forge${T.tiers[e.tier]?` · ${t('fromTpl')}: ${t('essence')} ${e.playerEssence} · ${esc(T.tiers[e.tier][L])}`:''}</em></p>`
  };
  return {name:ename(e),type:'npc',img:'icons/svg/mystery-man.svg',system:sys,items,effects:[],flags:{'essence-antagonist-forge':{sourceId:e.id}},
    _stats:{systemId:'exaltedessence',systemVersion:'2.0.11',coreVersion:'13.345'}};
}
/* one macro for any number of NPCs; with a folder name it creates (or reuses) that Actors folder */
function toMacro(list,folder){list=[].concat(list);const ds=list.map(e=>{const d=toFoundry(e);delete d._stats;return d});
  if(folder===undefined)folder=list.length===1?list[0].folder||'':'';
  const line=s=>String(s).replace(/\s+/g,' ');
  return `// Essence Antagonist Forge -> Exalted Essence 2.0.11\n// ${folder?line(folder)+': ':''}${ds.map(d=>line(d.name)).join(', ')}\n`+
    `const folderName = ${JSON.stringify(folder)};\nconst data = ${JSON.stringify(ds,null,1)};\n`+
    `if (folderName) {\n  const folder = game.folders.find(f => f.type === 'Actor' && f.name === folderName) ?? await Folder.create({ name: folderName, type: 'Actor' });\n  data.forEach(d => d.folder = folder.id);\n}\n`+
    `const actors = await Actor.implementation.createDocuments(data);\n`+
    `ui.notifications.info(\`\${actors.length} NPC(s) criado(s) / created\${folderName ? ': ' + folderName : ''}\`);\n`+
    `if (actors.length === 1) actors[0].sheet.render(true);\n`}

const ALL=[...D.charms,...D.qualities];
function filtered(){
  const q=F.q.trim().toLowerCase(), me=+F.ess;
  return ALL.filter(x=>{
    if(F.book!=='all'&&(x.book||'core')!==F.book)return false;
    if(F.cat!=='all'&&x.category!==F.cat)return false;
    if(F.src!=='all'){
      if(F.src==='quality'){if(x.category!=='quality')return false}
      else if(EXALTS.includes(F.src)){if(!(x.source===F.src||['universal','martial-arts','sorcery'].includes(x.source)))return false}
      else if(x.source!==F.src)return false}
    if(x.minEssence&&x.minEssence>me)return false;
    if(F.tag!=='all'&&!(x.tags||[]).includes(F.tag))return false;
    if(q){const hay=(x.name+' '+(x.ability||'')+' '+(x.style||'')+' '+x.summary.en+' '+x.summary.pt+' '+(x.modes||[]).map(m=>m.name).join(' ')+' '+(x.antagonists||[]).join(' ')).toLowerCase();if(!hay.includes(q))return false}

}

      return `<details class="folder" data-fold="${i}" ${OPENF.has(fk)?'':'open'}><summary><span class="grow">${esc(f||t('noFolder'))} <span class="small">(${xs.length})</span></span>
       <button class="btn" type="button" data-fmacro="${i}">${t('folderMacro')}</button><button class="btn" type="button" data-fjson="${i}">${t('folderJson')}</button>
       ${f&&xs.length<ROSTER.length?`<button class="btn danger" type="button" data-fdel="${i}">${pendingDel==='folder:'+f?t('confirmDel'):t('delFolder')}</button>`:''}</summary>
      <ul class="roster">${xs.map(rosterItem).join('')}</ul></details>`}).join('')}
     <p class="note" style="margin-top:8px">${t('folderMacroNote')}</p>
     <div class="row" style="margin-top:10px"><button class="btn primary" type="button" id="b-new">+ ${t('newE')}</button></div></div>
    <div class="panel"><h3>${t('fTitle')}</h3><p class="note">${t('fLede')}</p><ol class="steps">${I18N[L].fSteps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
     <div class="row"><button class="btn primary" type="button" data-fx="macro">${t('foundryMacro')}</button><button class="btn" type="button" data-fx="json">${t('foundryJson')}</button><button class="btn" type="button" data-fx="enemy">${t('enemyJson')}</button><button class="btn" type="button" id="b-lib">${t('copyLib')}</button></div>
     <p class="note" style="margin-top:10px">${t('ioLede')}</p>
     <textarea class="io" id="b-io" aria-label="JSON"></textarea>
     <div class="imp"><label for="b-impf">${t('impFolder')}<input type="text" id="b-impf" list="b-folders"></label>
      <button class="btn" type="button" id="b-import">${t('loadJ')}</button>
      <button class="btn primary" type="button" id="b-files">${t('impFiles')}</button><input type="file" id="b-file" accept=".json,application/json" multiple hidden></div></div>
   </div>
  </div>`;
}
const rosterItem=x=>`<li aria-current="${x.id===ACTIVE}"><span><b>${esc(ename(x))}</b><br><span class="small">${esc(creLabel(x.creature))}${x.battlegroup?` · ${t('isBg')} Size ${x.size} / Drill ${esc(BGDRILL(x.drill).drill)}`:''} · Ess ${x.essence} · ${x.pools.primary.dice}/${x.pools.secondary.dice}/${x.pools.tertiary.dice} · HL ${x.health} · Def ${x.defense} · Soak ${x.soak} · Hard ${x.hardness} · ${x.charms.length+x.qualities.length} ${t('charms').toLowerCase()}/${t('qualities').toLowerCase()}</span></span>
      ${x.id===ACTIVE?`<span class="chip" style="--src:var(--accent)">${t('active')}</span>`:`<button class="btn" type="button" data-open="${x.id}">${t('open')}</button>`}
      <button class="btn" type="button" data-dup="${x.id}">${t('dup')}</button>
      ${ROSTER.length>1?`<button class="btn danger" type="button" data-del="${x.id}">${pendingDel===x.id?t('confirmDel'):t('del')}</button>`:''}</li>`;
const vb=document.getElementById('view-builder');
vb.addEventListener('input',ev=>{const el=ev.target,e=E();if(el.id==='b-io')return;
  if(el.dataset.s){e[el.dataset.s]=el.value}
  else if(el.dataset.pool){e.pools[el.dataset.pool].actions=el.value}
  else if(el.dataset.k){const v=+el.value||0,k=el.dataset.k;if(k==='p')e.pools.primary.dice=v;else if(k==='s')e.pools.secondary.dice=v;else if(k==='t')e.pools.tertiary.dice=v;else e[k]=v;
    if(k==='essence'&&el.value!==''){e.motes=motesFor(v);const mi=document.getElementById('b-motes');if(mi)mi.value=e.motes}}
  else return;
  save();renderDock();if(el.dataset.s==='name'||el.dataset.s==='creature')renderChrome()});
vb.addEventListener('change',ev=>{const s=ev.target.dataset.s,id=ev.target.id,e=E();
  /* turning a group on, or resizing it, sets Health from the Size table */
  if(id==='b-bg'||id==='b-size'||id==='b-drill'){
    if(id==='b-bg'){e.battlegroup=ev.target.checked;if(e.battlegroup){e.health=BGSIZE(e.size).health;const q=D.qualities.find(x=>x.id==='quality-battle-group');if(q&&!e.qualities.some(x=>x.id===q.id))e.qualities.push(pickQ(q))}
      else e.qualities=e.qualities.filter(x=>x.id!=='quality-battle-group')}
    if(id==='b-size'){e.size=+ev.target.value;e.health=BGSIZE(e.size).health}
    if(id==='b-drill')e.drill=+ev.target.value;
    save();renderDock();renderBuilderKeepFocus();return}if(s==='folder')E().folder=ev.target.value.trim();if(s==='creature'||s==='name'||s==='folder'){save();renderDock();renderBuilderKeepFocus()}
  if(ev.target.id==='b-file'){const fs=[...ev.target.files],dest=document.getElementById('b-impf').value.trim();
    Promise.all(fs.map(f=>f.text().then(parseEnemies).catch(()=>[]))).then(ls=>{try{importEnemies(ls.flat(),dest)}catch(err){toast(t('badJson'))}});ev.target.value=''}});
vb.addEventListener('toggle',ev=>{const d=ev.target;if(!d.classList||!d.classList.contains('folder'))return;const fk=folders()[+d.dataset.fold]||'\u0000';
  if(d.open)OPENF.delete(fk);else OPENF.add(fk);store.set('closedFolders',[...OPENF])},true);
function renderBuilderKeepFocus(){const id=document.activeElement&&document.activeElement.id;renderBuilder();const el=id&&document.getElementById(id);if(el&&el.focus)el.focus()}
vb.addEventListener('click',ev=>{
  const io=document.getElementById('b-io');
  const f=ev.target.closest('[data-fx]');if(f){exportFx(f.dataset.fx);return}
  if(ev.target.id==='b-lib'){copy(JSON.stringify(D),io);return}
  if(ev.target.id==='b-new'){newEnemy();return}
  const o=ev.target.closest('[data-open]');if(o){ACTIVE=o.dataset.open;pendingDel=null;save();renderAll();return}
  const du=ev.target.closest('[data-dup]');if(du){const src=ROSTER.find(x=>x.id===du.dataset.dup);const n=newEnemy(src);n.name=(src.name||t('unnamed'))+' (2)';save();renderAll();return}
  const de=ev.target.closest('[data-del]');if(de){const id=de.dataset.del;
    if(pendingDel!==id){pendingDel=id;renderBuilder();return}
    ROSTER=ROSTER.filter(x=>x.id!==id);pendingDel=null;if(ACTIVE===id)ACTIVE=ROSTER[0].id;save();renderAll();return}
  const fi=ev.target.closest('[data-fmacro],[data-fjson],[data-fdel]');
  if(fi){ev.preventDefault();const f=folders()[+(fi.dataset.fmacro??fi.dataset.fjson??fi.dataset.fdel)],xs=inFolder(f);
    if(fi.dataset.fmacro!==undefined){copy(toMacro(xs,f),io);return}
    if(fi.dataset.fjson!==undefined){copy(JSON.stringify({folder:f,enemies:xs.map(({id,...x})=>x)},null,2),io);return}
    if(pendingDel!=='folder:'+f){pendingDel='folder:'+f;renderBuilder();return}
    ROSTER=ROSTER.filter(x=>x.folder!==f);pendingDel=null;if(!ROSTER.some(x=>x.id===ACTIVE))ACTIVE=ROSTER[0].id;save();renderAll();return}
  if(ev.target.id==='b-files'){document.getElementById('b-file').click();return}
  if(ev.target.id==='b-import'){try{importEnemies(parseEnemies(io.value),document.getElementById('b-impf').value.trim())}catch(err){toast(t('badJson'))}}
});

function renderAll(){renderChrome();renderDock();if(TAB==='templates')renderTemplates();if(TAB==='library')renderLibrary();if(TAB==='builder')renderBuilder()}
renderAll();
</script>
